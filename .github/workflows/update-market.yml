
name: Update DSH Plugin Market

on:
  # 允许在 GitHub 网页手动运行
  workflow_dispatch:

  # 修改插件清单或工作流时自动运行
  push:
    branches:
      - main
    paths:
      - "plugins.txt"
      - ".github/workflows/update-market.yml"

  # 每小时的第 17 分钟检查一次更新（北京时间）。
  #
  # 为什么不排"每天几个固定时间点"：
  # GitHub 的 schedule 触发器是 best-effort 交付的。官方文档写明它会
  # "在高负载时被延迟"，而且"负载足够高时，部分排队中的任务会被丢弃"。
  # 实测这个仓库 2026-10-19 的一次定时任务比预定时间晚了约 6 小时 45 分
  # 才被创建。如果一天只排 2 个时间点，其中一次被延迟或丢弃，索引就会
  # 整整一天不更新，表现出来就是"定时任务几乎不按设置的时间跑"。
  #
  # 所以改成高频触发：单次只跑约 30 秒，这个 job 又是幂等的（索引没变化
  # 就不提交），多跑几次没有副作用；某一次被延迟或丢弃，最多损失一小时
  # 的新鲜度，而不是一整天。公开仓库的 Actions 分钟数免费。
  #
  # 分钟刻意取 17 而不是 0，避开整点这个公认的高负载时段。
  # 想降低频率的话改成 "17 */6 * * *"（每 6 小时）即可。
  schedule:
    - cron: "17 * * * *"
      timezone: "Asia/Shanghai"

permissions:
  contents: write

concurrency:
  group: dsh-plugin-market-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      # 0. 记录本次触发的真实时间，便于以后核对调度是否延迟/丢单
      - name: Log trigger
        env:
          TZ: Asia/Shanghai
        run: |
          echo "event     = ${{ github.event_name }}"
          echo "cron_slot = ${{ github.event.schedule }}"
          echo "fired_at  = $(date '+%Y-%m-%d %H:%M:%S %Z (%z)')"
          echo "expected  = 每小时 :17 附近（Asia/Shanghai）"

      # 1. 下载个人索引仓库
      - name: Checkout personal market
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. 下载 DSH 官方源码（包含索引生成器）
      - name: Checkout DSH source
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: master
          path: .dsh-upstream
          persist-credentials: false

      # 3. 配置 pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
          run_install: false

      # 4. 配置 Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # 5. 安装官方生成器所需依赖
      - name: Install generator dependencies
        working-directory: .dsh-upstream
        run: |
          pnpm install \
            --frozen-lockfile \
            --filter @deepseek-ai/dsh-plugin-market-generator... \
            --ignore-scripts

      # 6. 根据 plugins.txt 生成索引
      - name: Generate market index
        working-directory: .dsh-upstream
        run: |
          mkdir -p ../site

          pnpm --filter @deepseek-ai/dsh-plugin-market-generator start \
            --input ../plugins.txt \
            --output ../site/index.json \
            --title "Slacom's DSH Plugins"

      # 7. 自动提交更新的索引
      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- site

          if git diff --cached --quiet; then
            echo "No index changes."
          else
            git commit -m "chore: update DSH plugin market"
            git push
          fi
